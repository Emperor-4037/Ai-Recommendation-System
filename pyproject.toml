[project]
name = "ai-recommendation-system"
version = "0.1.0"
description = "Deterministic ML Pipeline for AI Recommendation System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "click>=8.1.7",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "greenlet>=3.0.0",
    "pyarrow>=14.0.0",
    "torch>=2.2.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "polars>=0.20.0",
    "faiss-cpu>=1.7.4",
    "redis>=5.0.0",
    "mlflow>=2.10.0",
    "prometheus-client>=0.19.0",
    "pyyaml>=6.0.1",
    "sentence-transformers>=2.3.0",
    "optuna>=3.0.0",
    "requests>=2.28.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[project.scripts]
recsys = "recsys.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/recsys"]
